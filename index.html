<!--CODE HOSTED ON OPENPROCESSING-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Full Page Direct Host
    </title>
    <style>
      /* Base styles to prevent scrollbars before the sketch loads */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000; /* Optional: hides the white flash while fetching */
        }
    </style>
  </head>
  <body>
    <script>
    const baseUrl = `https://preview.openprocessing.org/sketch/2916368/preview/false/`;
    const targetUrl = baseUrl + &#34;index.html?random=&#34; + Number(Math.random().toFixed(15));

    fetch(targetUrl)
        .then(response =&gt; {
            if (!response.ok) throw new Error(&#34;Failed to fetch sketch code.&#34;);
            return response.text();
        })
        .then(html =&gt; {
            // 1. Create a &lt;base&gt; tag. 
            // This is the magic step for ES Modules. It tells the browser that 
            // any relative import like &#34;./myModule.js&#34; should resolve to &#39;baseUrl&#39;
            const baseTag = `&lt;base href=&#34;${baseUrl}&#34;&gt;`;
            
            // 2. Inject the base tag right after the opening &lt;head&gt; tag
            const newHtml = html.replace(/(&lt;head[^&gt;]*&gt;)/i, `$1\n    ${baseTag}`);

            // 3. Completely overwrite the current document with the fetched sketch
            document.open();
            document.write(newHtml);
            document.close();
        })
        .catch(error =&gt; {
            console.error(&#34;Fetch error:&#34;, error);
            document.body.innerHTML = `&lt;h3 style=&#34;color:white; text-align:center; margin-top:20px;&#34;&gt;
                Failed to fetch code. Check the console for CORS errors.
            &lt;/h3&gt;`;
        });
    </script>
  </body>
</html>
